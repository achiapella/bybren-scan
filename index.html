<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ByBren - Escanear tarjeta</title>
<style>
  :root { --brand:#7B66A8; --brand-dark:#5D4A84; --soft:#EEE9F7; --ink:#3A3352; --muted:#8A84A0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--soft); color:var(--ink); }
  .wrap { max-width:460px; margin:0 auto; padding:18px; }
  header { text-align:center; padding:14px 0 6px; }
  header .logo { font-family:Georgia,"Times New Roman",serif; letter-spacing:3px; font-size:22px; color:var(--brand-dark); }
  .card { background:#fff; border-radius:20px; padding:20px; box-shadow:0 12px 40px -20px rgba(58,51,82,.45); margin-top:14px; }
  h1 { font-size:19px; margin:0 0 6px; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:14px; font-size:16px; border:1px solid #E0DAEE; border-radius:12px; background:#FBFAFE; }
  button { width:100%; padding:16px; font-size:16px; font-weight:600; border:0; border-radius:14px; color:#fff; background:var(--brand); margin-top:12px; }
  button[disabled] { opacity:.5; }
  button.ghost { background:#fff; color:var(--brand-dark); border:1px solid #E0DAEE; }
  button.danger { background:#fff; color:#B23A5B; border:1px solid #F0CCD6; }
  .muted { color:var(--muted); font-size:12px; }
  .big { font-size:34px; font-weight:700; }
  .hearts { font-size:26px; letter-spacing:2px; margin:6px 0 2px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .pill { display:inline-block; font-size:12px; padding:4px 10px; border-radius:999px; background:var(--soft); color:var(--brand-dark); margin-top:8px; }
  .toast { margin-top:12px; padding:12px; border-radius:12px; font-size:14px; background:var(--soft); color:var(--brand-dark); }
  .toast.err { background:#FDECF1; color:#B23A5B; }
  .hidden { display:none; }
  .footer { text-align:center; margin:16px 0 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">BY BREN SCHOR</div><div class="muted">Panel de staff</div></header>

  <div id="nocard" class="card hidden">
    <h1>Falta la tarjeta</h1>
    <p class="sub">Este link no incluye el codigo. Escanea el QR de la tarjeta del cliente.</p>
  </div>

  <div id="login" class="card hidden">
    <h1>Ingresar</h1>
    <p class="sub">Entra con tu cuenta de staff para operar.</p>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="tu@email.com" />
    <label>Contrasena o PIN</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="****" />
    <button id="loginBtn">Ingresar</button>
    <div id="loginMsg" class="muted" style="margin-top:10px;"></div>
  </div>

  <div id="app" class="card hidden">
    <div class="muted">Tarjeta</div>
    <h1 id="custName">-</h1>
    <div id="hearts" class="hearts"></div>
    <div><span id="count" class="big">0/10</span> <span class="muted">sellos</span></div>
    <div id="statePill" class="pill">-</div>

    <button id="addBtn">Sumar 1 sello</button>
    <div class="row">
      <button id="redeemBtn" class="ghost">Canjear premio</button>
      <button id="removeBtn" class="danger">Restar</button>
    </div>
    <div id="msg" class="toast hidden"></div>
    <button id="logoutBtn" class="ghost" style="margin-top:16px;">Salir</button>
  </div>

  <div class="footer muted">El codigo identifica la tarjeta; la operacion se confirma aca.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = "https://ucfylsekubkgzdkikhkm.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_8XE4Zi5AYACETb9nJPKsXg_yzgWg726";
  var cardToken = new URLSearchParams(location.search).get("c");
  var cardUniqueId = null;
  var goal = 10;
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function el(id) { return document.getElementById(id); }
  function show(id) { ["nocard","login","app"].forEach(function(x){ el(x).classList.add("hidden"); }); if (id) el(id).classList.remove("hidden"); }
  function toast(text, isErr) { var m = el("msg"); m.textContent = text; m.className = "toast" + (isErr ? " err" : ""); m.classList.remove("hidden"); }
  function clearToast() { el("msg").classList.add("hidden"); }
  function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); }

  function renderCard(c) {
    cardUniqueId = c.uniqueId;
    goal = c.goal;
    el("custName").textContent = c.customerName || "Cliente";
    var hearts = "";
    for (var i = 0; i < c.goal; i++) hearts += (i < c.stamps ? "\uD83D\uDC9C" : "\u2661");
    el("hearts").textContent = hearts;
    el("count").textContent = c.stamps + "/" + c.goal;
    el("statePill").textContent = c.rewardAvailable ? "Premio disponible" : ("Faltan " + (c.goal - c.stamps) + " sellos");
    el("redeemBtn").disabled = !c.rewardAvailable;
    el("addBtn").disabled = !!c.rewardAvailable;
    show("app");
  }

  async function loadCard() {
    clearToast();
    var res = await client.rpc("resolve_card_by_token", { p_token: cardToken });
    if (res.error) { toast("No se pudo leer la tarjeta: " + res.error.message, true); return; }
    var d = res.data || {};
    if (d.status !== "ok") {
      var map = { missing: "No encontramos esa tarjeta.", foreign: "Esa tarjeta no es de este comercio.", not_authorized: "Sesion vencida. Volve a ingresar." };
      if (d.status === "not_authorized") { show("login"); }
      toast(map[d.status] || "Estado: " + d.status, true);
      return;
    }
    renderCard(d.card);
  }

  function busy(on) { ["addBtn","removeBtn","redeemBtn"].forEach(function(x){ if (el(x)) el(x).disabled = on; }); }

  async function call(op, payload, okText) {
    clearToast();
    var params = Object.assign({ p_idempotency_key: uuid() }, payload);
    var res = await client.rpc(op, params);
    if (res.error) { toast("Error: " + res.error.message, true); return; }
    var d = res.data || {};
    if (d.status === "ok") { toast(okText + " Saldo: " + d.stamps + "/" + goal + ". Guardado; el pase se actualiza en segundos."); await loadCard(); }
    else if (d.status === "duplicate") { toast("Esa operacion ya estaba registrada."); await loadCard(); }
    else { toast("No se pudo: " + d.status, true); }
  }

  el("loginBtn").onclick = async function () {
    var email = el("email").value.trim(), password = el("password").value;
    el("loginMsg").textContent = "";
    var res = await client.auth.signInWithPassword({ email: email, password: password });
    if (res.error) { el("loginMsg").textContent = "No pudimos ingresar: " + res.error.message; return; }
    await start();
  };

  el("addBtn").onclick = function () { call("add_stamp", { p_card_unique_id: cardUniqueId }, "Sello sumado."); };
  el("removeBtn").onclick = function () {
    var reason = prompt("Motivo de la resta:");
    if (!reason) return;
    call("remove_stamp", { p_card_unique_id: cardUniqueId, p_reason: reason }, "Sello restado.");
  };
  el("redeemBtn").onclick = function () {
    if (!confirm("Confirmas el canje del premio?")) return;
    call("redeem_reward", { p_card_unique_id: cardUniqueId }, "Premio canjeado.");
  };
  el("logoutBtn").onclick = async function () { await client.auth.signOut(); show("login"); };

  async function start() {
    var s = await client.auth.getSession();
    if (!s.data.session) { show("login"); return; }
    await loadCard();
  }

  if (!cardToken) { show("nocard"); } else { start(); }
</script>
</body>
</html>
